<section id="feedback" aria-labelledby="feedback-title">
  <div class="section-heading">
    <div>
      <p class="eyebrow">FEEDBACK / A LITTLE LOVE</p>
      <h2 id="feedback-title">Góc người nghe</h2>
    </div>
    <span class="feedback-heart" aria-hidden="true"
      ><svg class="icon"><use href="#icon-heart" /></svg
    ></span>
  </div>
  <p class="section-description">Vài lời thương, cùng một tình yêu âm nhạc.</p>
  <div class="feedback-list">
    @for (feedback of feedbacks(); track feedback.id) {
      <figure class="feedback-card">
        <div class="rating" role="img" [attr.aria-label]="feedback.rating + ' trên 5 sao'">
          @for (star of stars; track star) {
            <span aria-hidden="true" [class.is-muted]="star > feedback.rating">★</span>
          }
        </div>
        <blockquote>
          <p>“{{ feedback.quote }}”</p>
        </blockquote>
        <figcaption>
          <span class="listener-avatar" aria-hidden="true">{{ feedback.initials }}</span>
          <span class="listener-info">
            <strong>{{ feedback.name }}</strong>
            <span>{{ feedback.caption }}</span>
          </span>
          <svg class="icon listener-wave" aria-hidden="true"><use href="#icon-wave" /></svg>
        </figcaption>
      </figure>
    }
  </div>
  @if (musicStatus() !== 'live') {
    <p class="sample-note">Các nhận xét trên là nội dung minh họa.</p>
  }
  <a class="text-link" routerLink="/feedback">Chia sẻ cảm nhận của bạn ↗</a>
</section>
