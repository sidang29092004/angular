<svg class="icon-definitions" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
  <defs>
    <symbol id="icon-wave" viewBox="0 0 24 24">
      <path d="M5 8.5c4-2 10-2 14 .2M6 12c3.5-1.7 8.5-1.7 12 .2M7 15.5c3-1.3 7-1.3 10 .2" />
    </symbol>
    <symbol id="icon-play" viewBox="0 0 24 24">
      <path d="m9 5 11 7-11 7Z" fill="currentColor" stroke="none" />
    </symbol>
    <symbol id="icon-pause" viewBox="0 0 24 24">
      <path d="M9 5v14M16 5v14" stroke-width="3.5" />
    </symbol>
    <symbol id="icon-home" viewBox="0 0 24 24">
      <path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1Z" />
    </symbol>
    <symbol id="icon-search" viewBox="0 0 24 24">
      <circle cx="10.5" cy="10.5" r="7" />
      <path d="m16 16 5 5" />
    </symbol>
    <symbol id="icon-library" viewBox="0 0 24 24">
      <path d="M4 4v16M9 4v16m5-15 5-1 3 15-5 1Z" />
    </symbol>
    <symbol id="icon-arrow" viewBox="0 0 24 24">
      <path d="M5 12h14m-6-6 6 6-6 6" />
    </symbol>
    <symbol id="icon-arrow-up" viewBox="0 0 24 24">
      <path d="M6 18 18 6M6 6h12v12" />
    </symbol>
    <symbol id="icon-headphones" viewBox="0 0 24 24">
      <path d="M4 14v-3a8 8 0 0 1 16 0v3" />
      <rect x="3" y="12" width="4" height="8" rx="2" />
      <rect x="17" y="12" width="4" height="8" rx="2" />
    </symbol>
    <symbol id="icon-heart" viewBox="0 0 24 24">
      <path
        d="M20.8 5.6a5.5 5.5 0 0 0-7.8 0L12 6.7l-1.1-1.1a5.5 5.5 0 0 0-7.8 7.8L12 22l8.8-8.6a5.5 5.5 0 0 0 0-7.8Z"
      />
    </symbol>
    <symbol id="icon-sparkle" viewBox="0 0 24 24">
      <path d="m12 2 2.8 7.2L22 12l-7.2 2.8L12 22l-2.8-7.2L2 12l7.2-2.8Z" />
    </symbol>
    <symbol id="icon-globe" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="9" />
      <ellipse cx="12" cy="12" rx="4" ry="9" />
      <path d="M3 12h18" />
    </symbol>
    <symbol id="icon-mail" viewBox="0 0 24 24">
      <rect x="3" y="5" width="18" height="14" rx="3" />
      <path d="m3 7 9 6 9-6" />
    </symbol>
    <symbol id="icon-sun" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="2" />
      <path d="M12 2v2m0 16v2M4.93 4.93l1.41 1.41m11.32 11.32 1.41 1.41M2 12h2m16 0h2M6.34 17.66l-1.41 1.41m14.14-14.14-1.41 1.41" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
    </symbol>
    <symbol id="icon-moon" viewBox="0 0 24 24">
      <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    </symbol>
  </defs>
</svg>

@if (isAdmin()) {
  <router-outlet />
} @else {
  <a class="skip-link" href="#main-content">Đến nội dung chính</a>

  <div class="app-shell" id="home">
    <app-header />
    <main id="main-content">
      @if (music.status() === 'offline') {
        <div class="connection-notice" role="status">
          <span>Chưa kết nối được máy chủ. Đang hiển thị dữ liệu mẫu.</span>
          <button type="button" (click)="music.load()">Thử lại</button>
        </div>
      }
      <router-outlet />
    </main>
    <app-footer />
    <app-bottom-nav />
  </div>
}
